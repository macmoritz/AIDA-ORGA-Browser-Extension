<!doctype html>
<html>
	<head>
		<title>AIDA ORGA Finishing Time Extension Settings</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
                <script src="./options.js"></script>
	</head>
	
	<body> 
		<div class="bg-slate-700 h-dvh p-3 flex flex-col items-center gap-3">
			<div>
				<h1 class="text-neutral-300 text-heading text-2xl font-semibold">AIDA ORGA Finishing Time Extension Settings</h1>
			</div>
			<div class="w-screen md:w-3/4 bg-neutral-300 p-3 rounded-lg">
				<form id="form">
					<label for="targetUrl">URL to match the AIDA ORGA website for patching.</label>
					<input
						type="text"
						placeholder="URL of AIDA ORGA web interface"
						required
						name="targetUrl"
						id="targetUrl"
                                                pattern="https://.*/.*"
						class="w-1/2 border text-heading text-sm rounded-base focus:ring-brand focus:border-brand block px-3 py-2.5 shadow-xs placeholder:text-body"
					/>
					<p>You can use <span class="">*</span> to match multiple characters</p>
					
					
					<div class="flex flex-row justify-end">
						<input type="submit" value="Apply" class="border py-1 px-3" />
					</div>
				</form>
			</div>
		</div>
	</body>
</html>
